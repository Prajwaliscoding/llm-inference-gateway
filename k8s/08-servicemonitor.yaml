apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: gateway-servicemonitor
  namespace: llm-gateway
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: gateway
  namespaceSelector:
    matchNames:
      - llm-gateway
  endpoints:
    - port: http
      path: /metrics
      interval: 15s